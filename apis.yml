name: Graneet
description: Graneet is a French vertical-SaaS ERP for the construction and public-works
  (BTP) sector, built for small and mid-sized contractors (roughly EUR 2M to 100M in
  revenue) to protect project profitability from the office to the job site. It unifies
  cost estimating and quotations, progress (situation) invoicing, purchase and supplier-invoice
  management, project planning and labor tracking, cash and bank reconciliation, and
  real-time margin dashboards, with a companion mobile app and prebuilt integrations
  to accounting tools such as Sage 100 and Pennylane. The product is delivered as a
  cloud application (app.graneet.com) backed by internal Main, BFF, and Quotation APIs;
  there is no public developer API or OpenAPI at this time.
